# Five shopper requests for seeing the first search layer's strengths and gaps.
- query: oneplus 13
  expect: >
    The OnePlus 13 appears in the results. Closely related OnePlus models may
    rank around it.

- query: iphone 16 pro max
  expect: >
    The iPhone 16 Pro Max appears in the results. Closely related iPhone Pro
    models may rank around it.

- query: iphone for my dad
  expect: >
    Every phone shown is an iPhone. Older or simpler iPhones are reasonable,
    but Android phones do not satisfy the request.

- query: pink phone for my daughter
  expect: >
    Every phone shown is available in pink. A list where only one result offers
    pink and the rest come in other colours does not satisfy the request.

- query: best phone under 15000
  expect: >
    Every phone shown costs under ₹15,000, and they are the more capable
    options at that price rather than the cheapest things available.
